<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 626 300" width="626" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5cbcec"/>
      <stop offset="50%" stop-color="#2f8fca"/>
      <stop offset="100%" stop-color="#1c6aa3"/>
    </linearGradient>
    <linearGradient id="btnHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="badgeGrad" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#9be05e"/>
      <stop offset="60%" stop-color="#4caf2a"/>
      <stop offset="100%" stop-color="#2a7a14"/>
    </radialGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b9c4cc"/>
    </linearGradient>
  </defs>

  <!-- Botão azul -->
  <rect x="26" y="76" width="484" height="180" rx="32" ry="32" fill="url(#btnGrad)" stroke="#123f63" stroke-width="6"/>
  <rect x="36" y="86" width="464" height="70" rx="26" ry="26" fill="url(#btnHighlight)"/>
  <rect x="34" y="84" width="468" height="164" rx="28" ry="28" fill="none" stroke="#7fcdf5" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Setas duplas (avançar) -->
  <polygon points="92,132 150,167 92,202" fill="url(#arrowGrad)" stroke="#6f7f8b" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="146,132 206,167 146,202" fill="url(#arrowGrad)" stroke="#6f7f8b" stroke-width="3" stroke-linejoin="round"/>

  <!-- Texto -->
  <text x="340" y="160" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#2a1f0e" text-anchor="middle">PULAR</text>
  <text x="340" y="216" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#2a1f0e" text-anchor="middle">QUESTÃO</text>

  <!-- Badge verde com 5 -->
  <circle cx="482" cy="76" r="60" fill="url(#badgeGrad)" stroke="#1d5510" stroke-width="5"/>
  <ellipse cx="482" cy="50" rx="40" ry="16" fill="#ffffff" fill-opacity="0.25"/>
  <text x="482" y="108" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#ffffff" text-anchor="middle">5</text>
</svg>
